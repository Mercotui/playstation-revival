# derived from https://gist.github.com/mafredri/e88401c91489232e92e493d0e02912ef
[global]
    workgroup = WORKGROUP
    server role = standalone server
    map to guest = bad user
    security = user
    guest account = nobody
    log file = /dev/stdout
    log level = 2

    # Required for OPL: Samba disabled SMB1 by default in 4.11+,
    # OPL only speaks the NT1 (SMB1) dialect.
    server min protocol = NT1
    server signing = disabled
    smb encrypt = disabled

    # Lower latency / avoid stutter during FMV playback, per the gist
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE
    keepalive = 0
    strict locking = no

[PS2]
    path = /shared
    comment = PlayStation 2 ISOs
    browseable = yes
    guest ok = yes
    guest only = yes
    read only = yes
    follow symlinks = yes
    veto files = /.snapshots/@Recycle/.DS_Store/Thumbs.db/
    delete veto files = yes
